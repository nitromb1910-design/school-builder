            screenGroup.rotation.x = -Math.PI / 7;
            screenGroup.castShadow = true;

            // петля, совмещённая с задним краем
            const hinge = new THREE.Mesh(
                new THREE.BoxGeometry(w * 0.5, 0.6, 0.8),
                bezelMat
            );
            hinge.position.set(0, bodyH + 0.4, -d * 0.48);
            hinge.castShadow = true;
            group.add(hinge);

            group.add(screenGroup);
        }

        group.userData = { ...data, ...group.userData };
        if (data.type === 'screen' || data.type === 'laptop') group.userData.powerOn = false;
        prepareFurnitureColoring(group, data.type);
        if (CLICK_COLORABLE_TYPES.includes(data.type)) {
            group.userData.colorIndex = group.userData.colorIndex ?? -1;
        }

        return group;
    }

    // ----- поиск стола под ноутбуком -----
    function findDeskUnder(x, z) {
        let best = null;
        state.placed.forEach(p => {
            if (p.userData && (p.userData.type === 'desk' || p.userData.type === 'desk_large')) {
                const box = new THREE.Box3().setFromObject(p);
                if (x >= box.min.x && x <= box.max.x && z >= box.min.z && z <= box.max.z) {
                    best = { obj: p, top: box.max.y };
                }
            }
        });
        return best;
    }

    function isWallMountedType(type) {
        return ['screen', 'board', 'sink', 'stage', 'roll_screen', 'fountain', 'chalk_wall', 'curtain'].includes(type);
    }

    function handleInput(x, y) {
        if (!state.selected) return;
        if (state.selected.type === 'brush') return;

        mouse.x = (x / window.innerWidth) * 2 - 1;
        mouse.y = -(y / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);

        if (state.selected.type === 'eraser') {
            const hits = raycaster.intersectObjects(state.placed, true);
            if (hits.length > 0) {
                let obj = hits[0].object;
                while (obj.parent && obj.parent !== scene) obj = obj.parent;

                if (state.hovered && state.hovered !== obj) {
                    state.hovered.traverse(c => { if (c.isMesh && c.material.emissive) c.material.emissive.setHex(0x000000); });
                }
                state.hovered = obj;
                state.hovered.traverse(c => {
                    if (c.isMesh && c.material.emissive) {
                        c.material.emissive.setHex(0xFF0000);
                        c.material.emissiveIntensity = 0.5;
                    }
                });
            } else {
                if (state.hovered) {
                    state.hovered.traverse(c => { if (c.isMesh && c.material.emissive) c.material.emissive.setHex(0x000000); });
                    state.hovered = null;
                }
            }
            return;
        }

        const hits = raycaster.intersectObject(plane);
        if (hits.length > 0) {
            updateGhost(hits[0].point);
        }
    }

    function updateScreenTooltip(e) {
        if (chalkEditorEl.classList.contains('visible')) {
            screenTooltip.classList.remove('visible');
            return;
        }
        if (state.selected) {
            hoveredScreen = null;
            screenTooltip.classList.remove('visible');
            return;
        }

        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);

        const hits = raycaster.intersectObjects(getInteractiveObjects(), true);
        let foundInteractive = null;
        for (let h of hits) {
            let obj = h.object;
            while (obj.parent && obj.parent !== scene) obj = obj.parent;
            if (
                obj.userData &&
                (
                    obj.userData.type === 'screen' ||
                    obj.userData.type === 'laptop' ||
                    obj.userData.type === 'roll_screen' ||
                    obj.userData.type === 'projector' ||
                    obj.userData.type === 'acoustic' ||
                    obj.userData.type === 'pouf' ||
                    obj.userData.type === 'sofa' ||
                    obj.userData.type === 'house' ||
                    obj.userData.type === 'window_bench' ||
                    obj.userData.type === 'cushion' ||
                    obj.userData.type === 'lounge_chair' ||
                    obj.userData.type === 'chalk_wall' ||
                    obj.userData.type === 'curtain' ||
                    CLICK_COLORABLE_TYPES.includes(obj.userData.type)
                )
            ) {
                foundInteractive = obj;
                break;
            }
        }

        if (foundInteractive) {
            hoveredScreen = foundInteractive;
            const powerOn = !!foundInteractive.userData.powerOn;
            const type = foundInteractive.userData.type;
            const labels = {
                screen: powerOn ? 'Выключить экран' : 'Включить экран',
                laptop: powerOn ? 'Выключить ноутбук' : 'Включить ноутбук',
                roll_screen: foundInteractive.userData.screenDown ? 'Свернуть экран' : 'Спустить экран',
                projector: powerOn ? 'Выключить проектор' : 'Включить проектор',
                acoustic: 'Сменить цвет панели',
                pouf: 'Сменить цвет пуфа',
                sofa: 'Сменить цвет модуля',
                house: 'Сменить цвет домика',
                window_bench: 'Эксплуатируемый подоконник',
                cushion: 'Сменить цвет подушки',
                lounge_chair: 'Сменить цвет кресла',
                chalk_wall: 'Рисовать мелом',
                curtain: 'Управление шторами'
            };
            screenTooltip.textContent = labels[type] || (CLICK_COLORABLE_TYPES.includes(type) ? 'Сменить цвет мебели' : 'Изменить объект');
            screenTooltip.style.left = (e.clientX + 16) + 'px';
            screenTooltip.style.top = (e.clientY + 16) + 'px';
            screenTooltip.classList.add('visible');
        } else {
            hoveredScreen = null;
            screenTooltip.classList.remove('visible');
        }
    }

    function onMove(e) {
        handleInput(e.clientX, e.clientY);
        updateScreenTooltip(e);
    }

    function onTouch(e) {
        if (e.touches.length > 0) {
            e.preventDefault();
            handleInput(e.touches[0].clientX, e.touches[0].clientY);
        }
    }

    function updateGhost(pos) {
        if (!state.ghost) return;

        const x = Math.round(pos.x / GRID) * GRID;
        const z = Math.round(pos.z / GRID) * GRID;

        if (state.ghost.userData.type === 'laptop') {
            const support = findDeskUnder(x, z);
            if (support) {
                state.ghost.position.set(x, support.top, z);
            } else {
                state.ghost.position.set(x, 0, z);
            }

            const valid = !!support && checkValid(state.ghost);
            state.ghost.traverse(c => {
                if (c.isMesh && c.material.emissive) {
                    c.material.emissive.setHex(valid ? 0x00ff00 : 0xff0000);
                    c.material.emissiveIntensity = 0.5;
                }
            });
            return;
        }

        if (state.ghost.userData.type === 'cushion' && state.currentRoom === 'mmp') {
            const bounds = getRoomBounds();
            const metrics = getAmphitheaterMetrics(bounds.w * GRID, bounds.d * GRID, 'mmp');
            const rowIndex = Math.max(0, Math.min(
                metrics.steps - 1,
                Math.round((metrics.frontZ - z) / metrics.stepD)
            ));
            const rowZ = metrics.frontZ - rowIndex * metrics.stepD;
            const cushionX = Math.max(
                -metrics.width / 2 + 30,
                Math.min(metrics.width / 2 - 30, Math.round(x / 24) * 24)
            );
            state.ghost.position.set(cushionX, 11 + rowIndex * 10, rowZ);

            const valid = checkValid(state.ghost);
            state.ghost.traverse(c => {
                if (c.isMesh && c.material.emissive) {
                    c.material.emissive.setHex(valid ? 0x00ff00 : 0xff0000);
                    c.material.emissiveIntensity = 0.5;
                }
            });
            return;
        }

        if (state.ghost.userData.type === 'cushion' && state.currentRoom === 'recreation') {
            const bounds = getRoomBounds();
            const upperLevel = pos.x > bounds.maxX - 48;
            const benchX = upperLevel ? bounds.maxX - 22 : bounds.maxX - 70;
            const benchY = upperLevel ? 33.1 : 15.1;
            const benchZ = Math.max(bounds.minZ + 38, Math.min(bounds.maxZ - 38, Math.round(z / 14) * 14));
            state.ghost.position.set(benchX, benchY, benchZ);

            const valid = checkValid(state.ghost);
            state.ghost.traverse(c => {
                if (c.isMesh && c.material.emissive) {
                    c.material.emissive.setHex(valid ? 0x00ff00 : 0xff0000);
                    c.material.emissiveIntensity = 0.5;
                }
            });
            return;
        }

        if (isWallMountedType(state.ghost.userData.type)) {
            const bounds = getRoomBounds();
            const offset = state.ghost.userData.type === 'fountain'
                ? 2
                : (state.ghost.userData.type === 'chalk_wall' ? 2.5 : state.ghost.userData.d * GRID / 2 + 2);
            if (state.currentRoom === 'mmp' && (state.ghost.userData.type === 'stage' || state.ghost.userData.type === 'curtain')) {
                const frontOffset = state.ghost.userData.type === 'curtain' ? 2.5 : offset + 8;
                state.ghost.position.set(0, 0, bounds.maxZ - frontOffset);
                state.ghost.rotation.y = Math.PI;
            } else {
                state.ghost.position.set(x, 0, bounds.minZ + offset);
            }
        } else {
            state.ghost.position.set(x, 0, z);
        }

        const valid = checkValid(state.ghost);
        state.ghost.traverse(c => {
            if (c.isMesh && c.material.emissive) {
                c.material.emissive.setHex(valid ? 0x00ff00 : 0xff0000);
                c.material.emissiveIntensity = 0.5;
            }
        });
    }

    function checkValid(obj) {
        const box = new THREE.Box3().setFromObject(obj);
        const bounds = getRoomBounds();
        const minX = bounds.minX, maxX = bounds.maxX;
        const minZ = bounds.minZ, maxZ = bounds.maxZ;

        if (obj.userData.type === 'laptop') {
            const center = new THREE.Vector3();
            box.getCenter(center);
            const support = findDeskUnder(center.x, center.z);
            if (!support) return false;
        }

        if (box.min.x < minX || box.max.x > maxX || box.max.z > maxZ) return false;

        if (!isWallMountedType(obj.userData.type)) {
            if (box.min.z < minZ) return false;
        }

        const objBox = new THREE.Box3().setFromObject(obj).expandByScalar(-1);
        for (let p of state.placed) {
            if (new THREE.Box3().setFromObject(p).expandByScalar(-1).intersectsBox(objBox)) return false;
        }

        if (obj.userData.type === 'sink') {
            if (Math.abs(box.min.z - minZ) > 80) return false;
        }

        if (obj.userData.type === 'fountain' || obj.userData.type === 'chalk_wall') {
            if (Math.abs(box.min.z - minZ) > 12) return false;
        }

        return true;
    }

    function triggerPlace() {
        if (!state.selected) return;

        if (state.selected.type === 'brush') {
            return;
        }

        if (state.selected.type === 'eraser') {
            if (state.hovered) {
                scene.remove(state.hovered);
                state.placed = state.placed.filter(p => p !== state.hovered);
                state.hovered = null;
                checkTasks();
            }
            return;
        }

        if (state.ghost) {
            if (checkValid(state.ghost)) {
                const clone = state.ghost.clone();
                clone.traverse(c => {
                    if (c.isMesh) {
                        c.material = c.material.clone();
                        if (c.userData.isChalkSurface && c.material.map && c.material.map.image) {
                            const sourceCanvas = c.material.map.image;
                            const drawingCanvas = document.createElement('canvas');
                            drawingCanvas.width = sourceCanvas.width;
                            drawingCanvas.height = sourceCanvas.height;
                            drawingCanvas.getContext('2d').drawImage(sourceCanvas, 0, 0);
                            const drawingTexture = new THREE.CanvasTexture(drawingCanvas);
                            drawingTexture.encoding = THREE.sRGBEncoding;
                            drawingTexture.anisotropy = 8;
                            drawingTexture.needsUpdate = true;
                            c.material.map = drawingTexture;
                        }
                        if (c.material.emissive) {
                            c.material.emissive.setHex(0x000000);
                            c.material.emissiveIntensity = 0;
                        }
                        c.material.transparent = false;
                        c.material.opacity = 1;
                    }
                });
                scene.add(clone);
                state.placed.push(clone);

                clone.scale.set(0, 0, 0);
                let s = 0;
                const anim = () => { s += 0.1; clone.scale.set(s, s, s); if (s < 1) requestAnimationFrame(anim); };
                anim();

                checkTasks();
                if (clone.userData.type === 'chalk_wall') {
                    scene.remove(state.ghost);
                    state.ghost = null;
                    state.selected = null;
                    document.querySelectorAll('.item-card').forEach(c => c.classList.remove('active'));
                }
            } else {
                scene.remove(state.ghost);
                state.ghost = null;
                state.selected = null;
                document.querySelectorAll('.item-card').forEach(c => c.classList.remove('active'));
            }
        }
    }

    // --- экран / ноут: простое переключение ---
    function animateScreenSurface(surface, turnOn, kind) {
        const mat = surface.material;

        if (turnOn) {
            const tex = kind === 'laptop' ? laptopOsTexture : screenOsTexture;
            mat.map = tex;
            mat.color.set(0xffffff);
            mat.emissive.set(0x000000);
            mat.emissiveIntensity = 0;
            mat.transparent = false;
            mat.opacity = 1;
        } else {
            mat.map = null;
            mat.color.set(0x050506);
            mat.emissiveIntensity = 0;
            mat.transparent = false;
            mat.opacity = 1;
        }

        mat.needsUpdate = true;
    }

    function toggleScreenPower(screenObj) {
        let surface = null;
        let kind = 'screen';
        screenObj.traverse(child => {
            if (child.userData && child.userData.isScreenSurface) {
                surface = child;
                if (child.userData.screenKind) kind = child.userData.screenKind;
            }
        });
        if (!surface) return;

        const isOn = !!screenObj.userData.powerOn;
        screenObj.userData.powerOn = !isOn;
        animateScreenSurface(surface, !isOn, kind);
    }

    function getRollScreenSurface(screenObj) {
        let surface = null;
        screenObj.traverse(child => {
            if (child.userData && child.userData.isRollScreenSurface) surface = child;
        });
        return surface;
    }

    function setRollScreenState(screenObj, down, imageOn = screenObj.userData.imageOn) {
        const surface = getRollScreenSurface(screenObj);
        if (!surface) return;

        screenObj.userData.screenDown = down;
        screenObj.userData.imageOn = imageOn && down;
        const targetScale = down ? 1 : 0.03;
        const screenHeight = surface.userData.screenHeight || 72;
        let frame = 0;
        const startScale = surface.scale.y;
        const animateRoll = () => {
            frame += 1;
            const t = Math.min(frame / 14, 1);
            const eased = 1 - Math.pow(1 - t, 3);
            const scale = startScale + (targetScale - startScale) * eased;
            surface.scale.y = scale;
            surface.position.y = 82 - (screenHeight * scale) / 2;
            if (t < 1) requestAnimationFrame(animateRoll);
        };
        animateRoll();

        if (screenObj.userData.imageOn) {
            if (!projectionTexture) projectionTexture = createProjectionTexture();
            surface.material.map = projectionTexture;
            surface.material.color.set(0xffffff);
        } else {
            surface.material.map = null;
            surface.material.color.set(0xffffff);
        }
        surface.material.needsUpdate = true;
    }

    function toggleRollScreen(screenObj) {
        setRollScreenState(screenObj, !screenObj.userData.screenDown, false);
    }

    function setProjectorBeam(projectorObj, on) {
        projectorObj.userData.powerOn = on;
        projectorObj.traverse(child => {
            if (child.userData && child.userData.isProjectorBeam) {
                child.material.opacity = on ? 0.18 : 0;
                child.material.needsUpdate = true;
            }
        });
    }

    function toggleProjector(projectorObj) {
        const turnOn = !projectorObj.userData.powerOn;
        setProjectorBeam(projectorObj, turnOn);
        const screens = state.placed.filter(item => item.userData && item.userData.type === 'roll_screen');
        screens.forEach(screenObj => setRollScreenState(screenObj, true, turnOn));
    }

    function onClick(e) {
        if (chalkEditorEl.classList.contains('visible')) return;
        if (e.target.tagName !== 'CANVAS') return;
        if (e.button !== 0) return;

        if (state.selected && state.selected.type !== 'brush') {
            triggerPlace();
            return;
        }

        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);

        const hits = raycaster.intersectObjects(getInteractiveObjects(), true);
        hideCurtainControls();
        for (let h of hits) {
            let obj = h.object;
            while (obj.parent && obj.parent !== scene) obj = obj.parent;
            if (!obj.userData) continue;

            if (obj.userData.type === 'curtain') {
                showCurtainControls(obj, e);
                break;
            }

            if (obj.userData.type === 'chalk_wall') {
                openChalkEditor(obj);
                break;
            }

            if (obj.userData.type === 'screen' || obj.userData.type === 'laptop') {
                toggleScreenPower(obj);
                break;
            }

            if (obj.userData.type === 'roll_screen') {
                toggleRollScreen(obj);
                break;
            }

            if (obj.userData.type === 'projector') {
                toggleProjector(obj);
                break;
            }

            if (CLICK_COLORABLE_TYPES.includes(obj.userData.type)) {
                cycleColorableObject(obj);
                break;
            }
        }
    }

    function onTouchEnd(e) {
        if (chalkEditorEl.classList.contains('visible')) return;
        e.preventDefault();
        if (e.target.tagName !== 'CANVAS') return;
        triggerPlace();
    }

    window.addEventListener('wheel', (e) => {
        if (state.ghost && !isWallMountedType(state.ghost.userData.type)) {
            e.preventDefault();
            state.ghost.rotation.y += Math.sign(e.deltaY) * Math.PI / 2;
        }
    }, { passive: false });

    function selectItem(item, el) {
        const alreadyActive = el.classList.contains('active');

        document.querySelectorAll('.item-card').forEach(c => c.classList.remove('active'));

        if (alreadyActive) {
            state.selected = null;
            if (state.ghost) {
                scene.remove(state.ghost);
                state.ghost = null;
            }
            paletteEl.classList.remove('visible');
            return;
        }

        el.classList.add('active');
        state.selected = item;

        if (state.ghost) {
            scene.remove(state.ghost);
            state.ghost = null;
        }

        if (item.type === 'eraser') {
            paletteEl.classList.remove('visible');
            return;
        }

        if (item.type === 'brush') {
            renderPalette();
            paletteEl.classList.add('visible');
            return;
        }

        paletteEl.classList.remove('visible');
        state.ghost = createMesh(item);
        state.ghost.userData = item;
        state.ghost.traverse(c => { if (c.isMesh) { c.material.transparent = true; c.material.opacity = 0.6; } });
        scene.add(state.ghost);
    }

    function renderTasks() {
        const list = document.getElementById('taskList');
        list.innerHTML = '';
        state.tasks.forEach(t => {
            const div = document.createElement('div');
            div.className = `task-item ${t.done ? 'completed' : ''}`;
            div.innerHTML = `<div class="checkbox"></div> ${t.text}`;
            list.appendChild(div);
        });
        const roomComplete = state.tasks.length > 0 && state.tasks.every(task => task.done);
        document.getElementById('continueRoomBtn').classList.toggle('visible', roomComplete);
    }

    function checkTasks() {
        let all = true;
        state.tasks.forEach(t => {
            t.done = t.check(getTaskItems());
            if (!t.done) all = false;
        });
        renderTasks();
        if (all) {
            if (!state.completedRooms.includes(state.currentRoom)) {
                state.completedRooms.push(state.currentRoom);
            }
        }
    }

    document.getElementById('continueRoomBtn').onclick = () => {
        document.getElementById('backToMenuBtn').click();
    };

    document.getElementById('resetBtn').onclick = () => {
        hideCurtainControls();
        state.placed.forEach(p => scene.remove(p));
        state.placed = [];
        checkTasks();
    };

    document.querySelectorAll('.palette-tab').forEach(tab => {
        tab.addEventListener('click', () => {
            paletteMode = tab.dataset.paletteMode;
            renderPalette();
        });
    });

    // крестик палитры
    document.getElementById('paletteClose').addEventListener('click', () => {
        paletteEl.classList.remove('visible');
        state.selected = null;
        if (state.ghost) {
            scene.remove(state.ghost);
            state.ghost = null;
        }
        document.querySelectorAll('.item-card').forEach(c => c.classList.remove('active'));
    });

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }

    initScene();
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mousedown', onClick);
    window.addEventListener('touchmove', onTouch, { passive: false });
    window.addEventListener('touchend', onTouchEnd);
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
    animate();
</script>
</body>
